<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <title>Pesquisa SenaiTec</title>
</head>
<body>
    <header>
        <h1>Pesquisa SenaiTec</h1>   
    </header>
    <section>
        <form action="index.html" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>

                
                <label for="">Nome:</label>
                <input type="text" name="UserNome" id="UserNome" required>
                <br>

                <label for="UserAge">Idade:</label>
                <input type="number" ame="UserAge" id="UserAge" required min="12" max="100">


                <br>
                <label for="UserBirthDate">Data de Nascimento:</label>
                <input type="date" ame="UserBirthDate" id="UserBirthDate">

                <br>
                <label for="UserEmail">Email:</label>
                <input type="Email" ame="UserEmail" id="UserEmail" required>

                <br>
                <label for="Userphone">Telefone:</label>
                <input type="Userphone" ame="Userphone" id="Userphone" pattern="[0-9] {11}" placeholder="21987654321">

                
                <br>
                <label for="UserImage">upload da foto:</label>
                <input type="file" ame="UserImage" id="Userphone">


            </fieldset>
 
            <button type="submit">Enviar</button>
           

           

        </form>
 </section>
        
    
     
   
</body>
</html>
